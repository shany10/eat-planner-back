services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${NODE_PORT}:3000"
    environment:
      NODE_ENV: "development"
      MONGODB_URI: "${MONGODB_URI}"
      PORT: "3000"
      # IMPORTANT: depuis un container, `localhost` pointe vers le container lui-même.
      # On doit viser le nom de service Docker: `postgres`.
      # Valeur par défaut alignée sur la config du service postgres ci-dessous.
      # NB: on force ici pour éviter qu'un .env local avec localhost casse la connexion depuis Docker.
      DATABASE_URL: "postgresql://postgres:example@postgres:5432/mydb?schema=public"
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      app-network:
        aliases:
          - backend
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    # On démarre root juste pour fixer les droits sur le volume, puis on lance l'app en user `node`.
    user: "root"
    command: >
      sh -c "
        chmod +x ./docker/entrypoint.sh &&
        chown -R node:node /app/node_modules &&
        su node -c ./docker/entrypoint.sh
      "

  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USER}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASS}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --quiet --eval "db.adminCommand(''ping'').ok" | grep 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network
    volumes:
      - mongo-data:/data/db
  
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network
    volumes:
      - postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - app-network

volumes:
  node_modules:
  mongo-data:
  postgres-data:
networks:
  app-network:
    external: true
    name: app-network
